<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users Directory</title>
  <script src="users.js" defer></script>

</head>
<body>
  <h1>Users</h1>

  <div class="controls">
    <button id="load-users" type="button">Load users</button>
    <label for="filter-input">Filter by name</label>
    <input id="filter-input" type="text" placeholder="Type a name" autocomplete="off" />
  </div>

  <p id="status" role="status" aria-live="polite"></p>
  <ul id="users-list"></ul>

</body>
</html>
